<!DOCTYPE html>
<html lang="id">
<head>
<base target="_top">
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --kertas: #FFFFFF;
    --latar: #E8EAE4;
    --tinta: #16202A;
    --tinta-biru: #1B3B6F;
    --redup: #6E7681;
    --garis: #D5D8CF;
    --galat: #A3341F;
    --radius: 10px;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    padding: 28px 16px 64px;
    background: var(--latar);
    color: var(--tinta);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 15px;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }

  .lembar {
    max-width: 560px;
    margin: 0 auto;
    background: var(--kertas);
    border: 1px solid var(--garis);
    border-radius: var(--radius);
    box-shadow: 0 1px 2px rgba(22,32,42,.05), 0 12px 32px rgba(22,32,42,.07);
    overflow: hidden;
  }

  header {
    padding: 30px 30px 24px;
    border-bottom: 3px double var(--garis);
  }
  .eyebrow {
    font-size: 11px;
    letter-spacing: .16em;
    text-transform: uppercase;
    color: var(--redup);
    font-weight: 600;
    margin: 0 0 8px;
  }
  h1 {
    font-family: 'Instrument Serif', Georgia, serif;
    font-weight: 400;
    font-size: 34px;
    line-height: 1.1;
    margin: 0 0 8px;
    letter-spacing: -.01em;
  }
  header p {
    margin: 0;
    color: var(--redup);
    font-size: 14px;
  }

  form { padding: 26px 30px 30px; }

  .bidang { margin-bottom: 24px; }
  .bidang:last-of-type { margin-bottom: 20px; }

  label.judul {
    display: block;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--tinta);
    margin-bottom: 8px;
  }
  .wajib { color: var(--galat); }

  input[type="text"], textarea {
    width: 100%;
    font: inherit;
    color: var(--tinta);
    background: #FBFBF9;
    border: 1px solid var(--garis);
    border-radius: 8px;
    padding: 11px 13px;
    transition: border-color .15s, box-shadow .15s, background .15s;
  }
  textarea { resize: vertical; min-height: 88px; }
  input[type="text"]:focus, textarea:focus {
    outline: none;
    background: #FFF;
    border-color: var(--tinta-biru);
    box-shadow: 0 0 0 3px rgba(27,59,111,.13);
  }

  .pilihan { display: flex; gap: 10px; }
  .pilihan label {
    flex: 1;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 12px;
    border: 1px solid var(--garis);
    border-radius: 8px;
    background: #FBFBF9;
    cursor: pointer;
    font-weight: 500;
    transition: all .15s;
  }
  .pilihan input { position: absolute; opacity: 0; }
  .pilihan label:hover { border-color: #B6BAB1; }
  .pilihan input:checked + span { color: var(--tinta-biru); }
  .pilihan label:has(input:checked) {
    border-color: var(--tinta-biru);
    background: #F1F4F9;
    box-shadow: inset 0 0 0 1px var(--tinta-biru);
  }
  .pilihan input:focus-visible + span {
    outline: 2px solid var(--tinta-biru);
    outline-offset: 4px;
  }

  #kotakAlasan { display: none; }
  #kotakAlasan.tampil { display: block; }

  /* --- Area tanda tangan --- */
  .panel-ttd {
    position: relative;
    border: 1px solid var(--garis);
    border-radius: 8px;
    background: #FBFBF9;
    overflow: hidden;
  }
  #kanvas {
    display: block;
    width: 100%;
    height: 180px;
    touch-action: none;
    cursor: crosshair;
  }
  .garis-tanda {
    position: absolute;
    left: 26px; right: 26px; bottom: 42px;
    height: 1px;
    background: var(--garis);
    pointer-events: none;
  }
  .garis-tanda::before {
    content: '\00D7';
    position: absolute;
    left: -18px; top: -12px;
    font-size: 17px;
    color: #B6BAB1;
  }
  .petunjuk {
    position: absolute;
    left: 0; right: 0; bottom: 16px;
    text-align: center;
    font-size: 12px;
    color: #A8ADA3;
    pointer-events: none;
    transition: opacity .2s;
  }
  .panel-ttd.terisi .petunjuk { opacity: 0; }

  .aksi-ttd {
    display: flex;
    justify-content: flex-end;
    padding: 8px 10px;
    border-top: 1px dashed var(--garis);
    background: #F5F6F2;
  }
  .tautan {
    font: inherit;
    font-size: 13px;
    font-weight: 500;
    color: var(--redup);
    background: none;
    border: none;
    padding: 4px 8px;
    border-radius: 6px;
    cursor: pointer;
  }
  .tautan:hover { color: var(--tinta); background: #E8EAE4; }

  .galat {
    display: none;
    margin-top: 7px;
    font-size: 13px;
    color: var(--galat);
  }
  .galat.tampil { display: block; }

  button.kirim {
    width: 100%;
    font: inherit;
    font-weight: 600;
    color: #FFF;
    background: var(--tinta-biru);
    border: none;
    border-radius: 8px;
    padding: 14px;
    cursor: pointer;
    transition: background .15s, transform .05s;
  }
  button.kirim:hover { background: #16305A; }
  button.kirim:active { transform: translateY(1px); }
  button.kirim:disabled { background: #9AA3B0; cursor: progress; }

  .catatan {
    margin: 14px 0 0;
    font-size: 12px;
    color: var(--redup);
    text-align: center;
  }

  /* --- Layar berhasil --- */
  #selesai { display: none; padding: 48px 30px 44px; text-align: center; }
  #selesai.tampil { display: block; }
  .cap {
    width: 54px; height: 54px;
    margin: 0 auto 18px;
    border: 2px solid var(--tinta-biru);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    color: var(--tinta-biru);
    font-size: 26px;
  }
  #selesai h2 {
    font-family: 'Instrument Serif', Georgia, serif;
    font-weight: 400;
    font-size: 26px;
    margin: 0 0 6px;
  }
  #selesai p { margin: 0 0 22px; color: var(--redup); }

  @media (max-width: 480px) {
    body { padding: 14px 12px 40px; }
    header, form { padding-left: 20px; padding-right: 20px; }
    h1 { font-size: 28px; }
    .pilihan { flex-direction: column; }
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>
<body>

<div class="lembar">
  <header>
    <p class="eyebrow">Formulir Kehadiran</p>
    <h1>Daftar Hadir</h1>
    <p>Isi data berikut, lalu bubuhkan tanda tangan pada kolom yang tersedia.</p>
  </header>

  <form id="formulir" onsubmit="return false;">
    <div class="bidang">
      <label class="judul" for="nama">Nama <span class="wajib">*</span></label>
      <input type="text" id="nama" autocomplete="name" placeholder="Nama lengkap">
    </div>

    <div class="bidang">
      <label class="judul" for="instansi">Instansi <span class="wajib">*</span></label>
      <input type="text" id="instansi" autocomplete="organization" placeholder="Nama instansi atau unit kerja">
    </div>

    <div class="bidang">
      <span class="judul">Kehadiran <span class="wajib">*</span></span>
      <div class="pilihan">
        <label><input type="radio" name="kehadiran" value="Ya" onchange="aturAlasan()"><span>Ya, hadir</span></label>
        <label><input type="radio" name="kehadiran" value="Tidak" onchange="aturAlasan()"><span>Tidak hadir</span></label>
      </div>
    </div>

    <div class="bidang" id="kotakAlasan">
      <label class="judul" for="alasan">Alasan tidak hadir <span class="wajib">*</span></label>
      <textarea id="alasan" placeholder="Tuliskan alasan ketidakhadiran"></textarea>
    </div>

    <div class="bidang">
      <span class="judul">Tanda tangan <span class="wajib">*</span></span>
      <div class="panel-ttd" id="panelTtd">
        <canvas id="kanvas"></canvas>
        <div class="garis-tanda"></div>
        <div class="petunjuk">Tanda tangan di sini</div>
        <div class="aksi-ttd">
          <button type="button" class="tautan" onclick="bersihkanTtd()">Hapus tanda tangan</button>
        </div>
      </div>
    </div>

    <p class="galat" id="pesanGalat"></p>
    <button type="button" class="kirim" id="tombolKirim" onclick="kirim()">Kirim daftar hadir</button>
    <p class="catatan">Data dan tanda tangan disimpan otomatis ke Google Spreadsheet.</p>
  </form>

  <div id="selesai">
    <div class="cap">&#10003;</div>
    <h2>Terima kasih</h2>
    <p id="pesanSelesai"></p>
    <button type="button" class="tautan" onclick="ulangi()">Isi untuk orang lain</button>
  </div>
</div>

<script>
  /* =========================================================
     WAJIB DIISI: tempel URL Web App Apps Script (diakhiri /exec)
     ========================================================= */
  var URL_WEBAPP = 'GANTI_DENGAN_URL_WEB_APP_ANDA';

  var kanvas = document.getElementById('kanvas');
  var ktx = kanvas.getContext('2d');
  var panel = document.getElementById('panelTtd');
  var menggambar = false, adaGoresan = false, x0 = 0, y0 = 0;

  function siapkanKanvas() {
    var rasio = window.devicePixelRatio || 1;
    var lebar = kanvas.clientWidth;
    var tinggi = kanvas.clientHeight;
    kanvas.width  = lebar * rasio;
    kanvas.height = tinggi * rasio;
    ktx.setTransform(rasio, 0, 0, rasio, 0, 0);
    ktx.lineWidth = 2.2;
    ktx.lineCap = 'round';
    ktx.lineJoin = 'round';
    ktx.strokeStyle = '#1B3B6F';
  }
  siapkanKanvas();

  var lebarTerakhir = kanvas.clientWidth;
  window.addEventListener('resize', function () {
    if (kanvas.clientWidth === lebarTerakhir) return;
    lebarTerakhir = kanvas.clientWidth;
    siapkanKanvas();
    adaGoresan = false;
    panel.classList.remove('terisi');
  });

  function posisi(e) {
    var kotak = kanvas.getBoundingClientRect();
    return { x: e.clientX - kotak.left, y: e.clientY - kotak.top };
  }

  kanvas.addEventListener('pointerdown', function (e) {
    e.preventDefault();
    kanvas.setPointerCapture(e.pointerId);
    menggambar = true;
    var p = posisi(e);
    x0 = p.x; y0 = p.y;
    ktx.beginPath();
    ktx.arc(x0, y0, 1.1, 0, Math.PI * 2);
    ktx.fillStyle = '#1B3B6F';
    ktx.fill();
    adaGoresan = true;
    panel.classList.add('terisi');
    sembunyikanGalat();
  });

  kanvas.addEventListener('pointermove', function (e) {
    if (!menggambar) return;
    e.preventDefault();
    var p = posisi(e);
    ktx.beginPath();
    ktx.moveTo(x0, y0);
    ktx.lineTo(p.x, p.y);
    ktx.stroke();
    x0 = p.x; y0 = p.y;
  });

  ['pointerup', 'pointercancel', 'pointerleave'].forEach(function (ev) {
    kanvas.addEventListener(ev, function () { menggambar = false; });
  });

  function bersihkanTtd() {
    ktx.clearRect(0, 0, kanvas.width, kanvas.height);
    adaGoresan = false;
    panel.classList.remove('terisi');
  }

  function aturAlasan() {
    var pilih = document.querySelector('input[name="kehadiran"]:checked');
    var kotak = document.getElementById('kotakAlasan');
    if (pilih && pilih.value === 'Tidak') {
      kotak.classList.add('tampil');
    } else {
      kotak.classList.remove('tampil');
      document.getElementById('alasan').value = '';
    }
    sembunyikanGalat();
  }

  function tampilkanGalat(pesan) {
    var el = document.getElementById('pesanGalat');
    el.textContent = pesan;
    el.classList.add('tampil');
  }
  function sembunyikanGalat() {
    document.getElementById('pesanGalat').classList.remove('tampil');
  }

  function kirim() {
    var nama = document.getElementById('nama').value.trim();
    var instansi = document.getElementById('instansi').value.trim();
    var pilih = document.querySelector('input[name="kehadiran"]:checked');
    var alasan = document.getElementById('alasan').value.trim();

    if (!nama)      { tampilkanGalat('Nama belum diisi.'); document.getElementById('nama').focus(); return; }
    if (!instansi)  { tampilkanGalat('Instansi belum diisi.'); document.getElementById('instansi').focus(); return; }
    if (!pilih)     { tampilkanGalat('Pilih salah satu status kehadiran.'); return; }
    if (pilih.value === 'Tidak' && !alasan) {
      tampilkanGalat('Alasan wajib diisi karena Anda memilih tidak hadir.');
      document.getElementById('alasan').focus();
      return;
    }
    if (!adaGoresan) { tampilkanGalat('Tanda tangan belum dibubuhkan.'); return; }

    sembunyikanGalat();
    var tombol = document.getElementById('tombolKirim');
    tombol.disabled = true;
    tombol.textContent = 'Mengirim...';

    var muatan = {
      nama: nama,
      instansi: instansi,
      kehadiran: pilih.value,
      alasan: alasan,
      ttd: kanvas.toDataURL('image/png')
    };

    // Tanpa header Content-Type kustom, agar browser tidak mengirim
    // preflight OPTIONS yang tidak dilayani Apps Script.
    fetch(URL_WEBAPP, {
      method: 'POST',
      body: JSON.stringify(muatan)
    })
      .then(function (respons) { return respons.json(); })
      .then(function (hasil) {
        if (hasil.ok) {
          document.getElementById('formulir').style.display = 'none';
          document.getElementById('pesanSelesai').textContent = hasil.pesan;
          document.getElementById('selesai').classList.add('tampil');
        } else {
          gagal(hasil.pesan);
        }
      })
      .catch(function (err) {
        gagal('Pengiriman gagal: ' + err.message + '. Periksa koneksi lalu coba lagi.');
      });
  }

  function gagal(pesan) {
    tampilkanGalat(pesan);
    var tombol = document.getElementById('tombolKirim');
    tombol.disabled = false;
    tombol.textContent = 'Kirim daftar hadir';
  }

  function ulangi() {
    document.getElementById('formulir').reset();
    document.getElementById('kotakAlasan').classList.remove('tampil');
    bersihkanTtd();
    document.getElementById('selesai').classList.remove('tampil');
    document.getElementById('formulir').style.display = 'block';
    var tombol = document.getElementById('tombolKirim');
    tombol.disabled = false;
    tombol.textContent = 'Kirim daftar hadir';
    document.getElementById('nama').focus();
  }
</script>
</body>
</html>
